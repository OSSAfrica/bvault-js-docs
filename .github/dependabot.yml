version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tanstack:
        patterns: ['@tanstack/*']
      fumadocs:
        patterns: ['fumadocs-*', '@fumadocs/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
